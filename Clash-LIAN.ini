;2、策略组（域名组-节点组）
; 机场 -> url-test 选节点组中最快的
custom_proxy_group=机场`url-test`[]所有-自动`[]港台日新韩-自动`[]台日新韩-自动`[]香港-自动`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]美国-自动`[]其他-自动`https://cp.cloudflare.com/generate_204`300,100,5
; AI1 -> fallback 按顺序：家宽 -> 台日新韩 -> ...
custom_proxy_group=AI1`fallback`[]家宽节点`[]台日新韩-自动`[]所有-自动`[]港台日新韩-自动`[]香港-自动`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]美国-自动`[]其他-自动`[]REJECT`https://cp.cloudflare.com/generate_204`300,100,5
